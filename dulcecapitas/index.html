<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dulce Capitas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      /* =========================================
         PALETA AMARILLO PREMIUM / TECNOLÓGICA
         ========================================= */
      --bg-gradient: linear-gradient(180deg, #111111 0%, #080808 100%);
      --container-bg: #0d0d0d;

      --card-bg: #171717;
      --card-bg-hover: #1d1d1d;

      --border-color: rgba(245, 196, 0, 0.30);
      --hover-border: #f5c400;
      --accent-glow: rgba(245, 196, 0, 0.18);

      --accent: #f5c400;
      --accent-bright: #ffc928;

      --text-main: #f5f5f5;
      --text-sub: #a6a6a6;
      --text-muted: #737373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: var(--bg-gradient);
      border-radius: 18px;
      padding: 24px 16px;
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.45),
        0 0 30px rgba(245, 196, 0, 0.05);
      border: 1px solid rgba(245, 196, 0, 0.16);
      text-align: center;
    }

    /* =========================================
       IMAGEN BANNER
       ========================================= */

    .header-image {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      margin-bottom: 18px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #151515;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================================
       TÍTULO Y LOGO
       ========================================= */

    .logo-container {
      margin-bottom: 22px;
    }

    .logo-container img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin-bottom: 9px;
      box-shadow:
        0 0 0 2px rgba(245, 196, 0, 0.15),
        0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .logo-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 13px;
      font-style: italic;
      color: var(--text-sub);
      margin-top: 3px;
    }

    /* =========================================
       BOTONES PRINCIPALES
       ========================================= */

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;

      background: var(--card-bg);

      border: 1px solid var(--border-color);
      border-radius: 9px;

      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;

      transition: all 0.3s ease;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.18);
    }

    .btn-link i {
      color: var(--accent);
      font-size: 17px;
      width: 20px;
    }

    .btn-link:hover {
      border-color: var(--hover-border);
      background: var(--card-bg-hover);

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.35),
        0 0 16px var(--accent-glow);

      transform: translateY(-2px);
    }

    /* =========================================
       TÍTULO DE SECCIÓN
       ========================================= */

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin: 25px 0 12px 0;
      color: var(--accent);
      letter-spacing: 0.3px;
    }

    /* =========================================
       CONTENEDOR DE INFORMACIÓN
       ========================================= */

    .info-scroll-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 24px;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    .info-scroll-container::-webkit-scrollbar {
      height: 5px;
    }

    .info-scroll-container::-webkit-scrollbar-track {
      background: #151515;
      border-radius: 10px;
    }

    .info-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(245, 196, 0, 0.55);
      border-radius: 10px;
    }

    .info-card {
      min-width: 160px;
      max-width: 160px;

      background: var(--card-bg);

      border: 1px solid rgba(245, 196, 0, 0.22);
      border-radius: 10px;

      padding: 10px;
      text-align: left;

      flex-shrink: 0;
      scroll-snap-align: start;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.20);

      transition: border-color 0.3s ease;
    }

    .info-card:hover {
      border-color: rgba(245, 196, 0, 0.60);
    }

    .info-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 7px;
      margin-bottom: 8px;
    }

    .info-card h4 {
      font-size: 12px;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .info-card p {
      font-size: 10px;
      color: var(--text-sub);
      line-height: 1.3;
    }

    /* =========================================
       REDES SOCIALES
       ========================================= */

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .social-icons a {
      color: var(--text-muted);
      font-size: 20px;
      transition: all 0.3s ease;
    }

    .social-icons a:hover {
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* =========================================
       PIE DE PÁGINA
       ========================================= */

    .steps-footer {
      display: flex;
      justify-content: space-around;

      border-top: 1px solid rgba(255, 255, 255, 0.09);

      padding-top: 16px;

      font-size: 9px;
      color: var(--text-sub);
      font-weight: 600;
      line-height: 1.5;
    }

  </style>
</head>

<body>

  <div class="container">
    
    <!-- IMAGEN BANNER -->
    <div class="header-image">
      <img src="bannerdulcecapitas.jpg" alt="Imagen Banner">
    </div>

    <!-- TITULO Y LOGO -->
    <div class="logo-container">
      <img src="logodulcecapitas.jpg" alt="Logo de la empresa">
      <div class="logo-title">Dulce Capitas</div>
      <div class="subtitle">Alfajores Artesanales</div>
    </div>

    <!-- BOTONES PRINCIPALES -->
    <a href="https://wa.me/51999541711" target="_blank" class="btn-link">
      <i class="fa-brands fa-whatsapp"></i> WhatsApp
    </a>

    <a href="https://www.ventalista.lat/dulcecapitas" target="_blank" class="btn-link">
      <i class="fa-solid fa-globe"></i> Página Web
    </a>

    <a href="https://maps.google.com/?q=-12.046374,-77.042793" target="_blank" class="btn-link">
      <i class="fa-solid fa-map-location-dot"></i> Ubicación
    </a>

    <a href="tel:99954171" class="btn-link">
      <i class="fa-solid fa-user"></i> Contacto
    </a>

    <!-- SECCIÓN INFORMACIÓN CON ROTACIÓN AUTOMÁTICA -->
    <div class="section-title">Información</div>

    <div class="info-scroll-container" id="autoScrollContainer">
      
      <div class="info-card">
        <img src="imagen1dulcecapitas.jpg" alt="Imagen 1">
        <h4>Alfajores Variados</h4>
        </div>

      <div class="info-card">
        <img src="imagen2.jpg" alt="Imagen 2">
        <h4>Gatitos Juguetones</h4>
        </div>

      <div class="info-card">
        <img src="imagen3dulcecapitas.jpg" alt="Imagen 3">
        <h4>Bubu y Dudu</h4>
        </div>

    </div>

    <!-- REDES SOCIALES -->
    <div class="social-icons">

      <a href="https://www.facebook.com/ventalista.lat/" target="_blank">
        <i class="fa-brands fa-facebook"></i>
      </a>

      <a href="https://www.instagram.com/venta_lista/" target="_blank">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a href="https://www.tiktok.com/@ventalista.lat" target="_blank">
        <i class="fa-brands fa-tiktok"></i>
      </a>

    </div>

    <!-- PIE DE PÁGINA -->
    <div class="steps-footer">
      <div>Flowlite Systems</div>

    </div>

  </div>

  <!-- SCRIPT PARA AUTORROTACIÓN DE LAS CASILLAS -->
  <script>

    const container = document.getElementById('autoScrollContainer');

    const scrollAmount = 172;

    const delay = 2500;

    let autoScrollInterval;

    function startAutoScroll() {

      autoScrollInterval = setInterval(() => {

        // Si llegó al final del scroll, regresa al inicio (0)

        if (
          container.scrollLeft + container.clientWidth >=
          container.scrollWidth - 10
        ) {

          container.scrollTo({
            left: 0,
            behavior: 'smooth'
          });

        } else {

          // Desplaza a la siguiente casilla

          container.scrollBy({
            left: scrollAmount,
            behavior: 'smooth'
          });

        }

      }, delay);

    }

    function stopAutoScroll() {

      clearInterval(autoScrollInterval);

    }

    // Iniciar rotación al cargar

    startAutoScroll();

    // Pausar si el usuario toca o pasa el cursor encima

    container.addEventListener('mouseenter', stopAutoScroll);

    container.addEventListener('mouseleave', startAutoScroll);

    container.addEventListener('touchstart', stopAutoScroll);

    container.addEventListener('touchend', startAutoScroll);

  </script>

</body>
</html>
