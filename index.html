<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowlite - Tarjetas Digitales NFC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #020617;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 400px;
      width: 100%;
      background: linear-gradient(180deg, #0a192f 0%, #030814 100%);
      padding: 40px 20px;
      border-radius: 20px;
      border: 1px solid rgba(59, 130, 246, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .icon {
      font-size: 50px;
      color: #3b82f6;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      color: #93c5fd;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <i class="fa-solid fa-nfc-symbol"></i>
    </div>
    <h1>Flowlite NFC</h1>
    <p>Plataforma de gestión y perfiles digitales para tarjetas inteligentes NFC.</p>
    <a href="https://wa.me/51920832884?text=Hola,%20busco%20información%20sobre%20las%20tarjetas%20NFC" class="btn">Solicitar mi Tarjeta</a>
  </div>

</body>
</html>
