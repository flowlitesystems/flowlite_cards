<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kathe Pizarro - FWP</title>
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
      --card-container-bg: rgba(255, 255, 255, 0.85);
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --hover-border: #0ea5e9;
      --text-main: #0f172a;
      --text-sub: #475569;
      --btn-vcard: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: var(--card-container-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 28px 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1), 0 0 15px rgba(255, 255, 255, 0.5) inset;
      border: 1px solid rgba(255, 255, 255, 0.8);
      text-align: center;
    }

    /* Perfil Estilo Claro / Ejecutivo */
    .profile-container {
      margin-bottom: 24px;
    }

    .profile-container img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 12px;
      object-fit: cover;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
    }

    .logo-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-sub);
    }

    /* Botones de enlaces estilo tarjeta blanca flotante */
    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-link i {
      color: #0284c7;
      font-size: 18px;
    }

    .btn-link:hover {
      border-color: var(--hover-border);
      box-shadow: 0 8px 15px rgba(14, 165, 233, 0.15);
      transform: translateY(-2px);
    }

    /* Estilo exclusivo para el botón Guardar Contacto */
    .btn-vcard {
      background: var(--btn-vcard);
      border: 1px solid #0284c7;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
    }

    .btn-vcard i {
      color: #ffffff;
    }

    .btn-vcard:hover {
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.5);
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 24px 0 12px 0;
      color: var(--text-sub);
    }

    /* Contenedor de Información con Desplazamiento Horizontal Suave */
    .info-scroll-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 24px;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    .info-scroll-container::-webkit-scrollbar {
      height: 5px;
    }

    .info-scroll-container::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .info-card {
      min-width: 160px;
      max-width: 160px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      text-align: left;
      flex-shrink: 0;
      scroll-snap-align: start;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
    }

    .info-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .info-card h4 {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .info-card p {
      font-size: 10px;
      color: var(--text-sub);
      line-height: 1.3;
    }

    /* Redes Sociales */
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .social-icons a {
      color: var(--text-sub);
      font-size: 20px;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    .social-icons a:hover {
      color: #0284c7;
      transform: scale(1.1);
    }

    .steps-footer {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      font-size: 9px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- PERFIL ESTILO CLARO / EJECUTIVO -->
    <div class="profile-container">
      <img src="rostrokathe.jpg" alt="Rostro de Kathe Pizarro">
      <div class="logo-title">Kathe Pizarro</div>
      <div class="subtitle">Asesora Comercial - FWP</div>
    </div>

    <!-- BOTÓN 1: GUARDAR CONTACTO (NATIVO VCARD) -->
    <button onclick="downloadVCard()" class="btn-link btn-vcard">
      <i class="fa-solid fa-address-book"></i> Guardar Contacto
    </button>

    <!-- BOTONES PRINCIPALES -->
    <a href="https://wa.me/51999541711" target="_blank" class="btn-link">
      <i class="fa-brands fa-whatsapp"></i> WhatsApp
    </a>

    <a href="https://www.ventalista.lat/kathyfwp" target="_blank" class="btn-link">
      <i class="fa-solid fa-globe"></i> Página Web
    </a>

    <!-- SECCIÓN INFORMACIÓN CON ROTACIÓN AUTOMÁTICA -->
    <div class="section-title">Información</div>
    <div class="info-scroll-container" id="autoScrollContainer">
      
      <div class="info-card">
        <img src="productokathe1.jpg" alt="Imagen 1">
        <h4>Renova</h4>
         </div>

      <div class="info-card">
        <img src="productokathe2.jpg" alt="Imagen 2">
        <h4>Omega</h4>
        </div>

      <div class="info-card">
        <img src="productokathe4.jpg" alt="Imagen 4">
        <h4>Burn</h4>
        </div>

  
    </div>

    <!-- REDES SOCIALES -->
    <div class="social-icons">
      <a href="https://www.instagram.com/kathypizarro_coach/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://www.facebook.com/kathy.pizarro.90" target="_blank"><i class="fa-brands fa-facebook"></i></a>
    </div>

    <!-- PIE DE PÁGINA -->
    <div class="steps-footer">
      <div>PASO 1<br>Retira tu Tarjeta</div>
      <div>PASO 2<br>Acércala al celular</div>
      <div>PASO 3<br>Conéctate y comparte</div>
    </div>

  </div>

  <!-- SCRIPTS DE FUNCIONALIDAD -->
  <script>
    // 1. Generador y descargador de vCard Nativo
    function downloadVCard() {
      const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Kathe Pizarro
ORG:Renova+
TITLE:Asesora Comercial
TEL;TYPE=CELL,VOICE:+51999541711
URL:https://www.ventalista.lat/kathyfwp
NOTE:Guarda este contacto directamente desde nuestra tarjeta inteligente NFC.
END:VCARD`;

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Kathe_Pizarro.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // 2. Autorrotación de las casillas de información
    const container = document.getElementById('autoScrollContainer');
    const scrollAmount = 172; 
    const delay = 2500; 
    let autoScrollInterval;

    function startAutoScroll() {
      autoScrollInterval = setInterval(() => {
        if (container.scrollLeft + container.clientWidth >= container.scrollWidth - 10) {
          container.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }
      }, delay);
    }

    function stopAutoScroll() {
      clearInterval(autoScrollInterval);
    }

    startAutoScroll();

    container.addEventListener('mouseenter', stopAutoScroll);
    container.addEventListener('mouseleave', startAutoScroll);
    container.addEventListener('touchstart', stopAutoScroll);
    container.addEventListener('touchend', startAutoScroll);
  </script>

</body>
</html>
